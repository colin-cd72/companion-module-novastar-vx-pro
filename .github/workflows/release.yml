name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Locate tarball
        id: locate
        run: |
          TARBALL=$(ls novastar-vx-pro-*.tgz | head -1)
          echo "path=$TARBALL" >> $GITHUB_OUTPUT
          ls -la "$TARBALL"
      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.locate.outputs.path }}
          generate_release_notes: true
