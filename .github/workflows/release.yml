name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - run: npm ci
      - run: npm run build
      - name: Package tarball
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p tmp/novastar-vx-pro
          cp -r pkg/main.js pkg/companion pkg/package.json tmp/novastar-vx-pro/
          (cd tmp && tar czf ../novastar-vx-pro-v${VERSION}.tgz novastar-vx-pro/)
          ls -la novastar-vx-pro-v${VERSION}.tgz
      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: novastar-vx-pro-v*.tgz
          generate_release_notes: true
